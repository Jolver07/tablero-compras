<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tablero de Cumplimiento de Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de control fija arriba (corte, filtros), pestañas, y por pestaña: indicadores → gráfico → detalle */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --surface-2:#eef1f3; --line:#d9dfe3; --line-soft:#e7ebee;
  --ink:#10202b; --ink-2:#4a5a66; --ink-3:#7b8994;
  --accent:#1f5f99; --accent-soft:#e3edf7; --accent-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300; --crit-ink:#b42d2d; --warn-ink:#8a5a00;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172026; --surface-2:#1e2930; --line:#2c3a43; --line-soft:#24313a;
  --ink:#eef3f6; --ink-2:#b3c0c8; --ink-3:#83939d;
  --accent:#6aa8e6; --accent-soft:#1d3346; --accent-ink:#0b1620;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-ink:#3fc23f; --crit-ink:#ef7d7d; --warn-ink:#f5c04f;
  --grid:#2c2c2a; --axis:#4a4a46; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172026; --surface-2:#1e2930; --line:#2c3a43; --line-soft:#24313a;
  --ink:#eef3f6; --ink-2:#b3c0c8; --ink-3:#83939d;
  --accent:#6aa8e6; --accent-soft:#1d3346; --accent-ink:#0b1620;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-ink:#3fc23f; --crit-ink:#ef7d7d; --warn-ink:#f5c04f;
  --grid:#2c2c2a; --axis:#4a4a46; color-scheme:dark }
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:20px 14px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.src{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
input[type=date],input[type=number],input[type=search],select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-height:34px}
input[type=number]{width:70px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:6px 12px;min-height:34px;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.tab:focus-visible,.ms-btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.ms{position:relative}
.ms-btn{min-width:190px;max-width:260px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:6px 28px 6px 10px;min-height:34px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.ms-btn::after{content:"";position:absolute;right:10px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:translateY(-70%) rotate(45deg)}
.ms-btn.on{border-color:var(--accent);background:var(--accent-soft)}
.ms-pop{position:absolute;top:calc(100% + 4px);left:0;width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:8px;z-index:40}
.ms-pop input[type=search]{width:100%;margin-bottom:6px}
.ms-acts{display:flex;gap:6px;margin-bottom:6px}
.ms-acts button{flex:1;font-size:12px;padding:4px;min-height:28px}
.ms-list{max-height:300px;overflow:auto}
.ms-list label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;font-size:13px;cursor:pointer}
.ms-list label:hover{background:var(--surface-2)}
.ms-list .cnt{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px}
.ms-list .zero{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);min-height:20px;padding-top:6px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:16px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--ink-2);padding:10px 14px;font-size:14px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
section.panel{padding-top:18px;display:flex;flex-direction:column;gap:18px}
.lead{color:var(--ink-2);max-width:900px;margin:0;font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:500}
.tile .v{font-size:26px;font-weight:600;letter-spacing:-.01em}
.tile .d{font-size:12.5px;color:var(--ink-2)}
.tile.hero{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tile .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px;min-width:0}
.card h2{font-size:15px;font-weight:600;margin:0 0 2px}
.card .sub{color:var(--ink-3);font-size:12.5px;margin:0 0 10px}
.grid2{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--sans)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tbar .left{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{overflow:auto;max-height:560px;border:1px solid var(--line-soft);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.8px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--line-soft);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:11.8px;cursor:pointer;user-select:none;z-index:1}
th.num,td.num{text-align:right}
th .ar{color:var(--accent);margin-left:3px}
tbody tr:hover td{background:var(--surface-2)}
td.wrap{white-space:normal;min-width:220px;max-width:360px}
td.mono{font-family:var(--mono);font-size:12px}
tr.total td{font-weight:600;background:var(--accent-soft)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:10px;border:1px solid var(--line)}
.b-venc{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:color-mix(in srgb,var(--crit) 10%,transparent)}
.b-pv{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.b-ok{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.b-nd{color:var(--ink-2)}
.meter{display:inline-block;width:64px;height:6px;background:var(--surface-2);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--s1);border-radius:3px}
.pager{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:5px;z-index:60;max-width:260px;line-height:1.35}
#loading{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 85%,transparent);display:flex;align-items:center;justify-content:center;z-index:80;font-size:15px;color:var(--ink-2)}
.seg{align-self:flex-start;display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink-2);padding:6px 12px;font-size:13px;min-height:32px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.msg{font-size:12.5px;color:var(--ink-2)}
.pubbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.pubbar input{width:180px}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px 16px;font-size:12.5px;color:var(--ink-2);margin:0;padding:0;list-style:none}
.defs b{color:var(--ink);font-weight:600;display:block}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.msg.err{color:var(--crit-ink)}
@media (max-width:640px){.filters{position:static}.ms-btn{min-width:150px}.tile .v{font-size:22px}h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Tablero de cumplimiento de compras</h1>
      <div class="src" id="src">Cargando datos…</div>
    </div>
    <div class="ctrls">
      <label class="f" for="corte">Fecha de corte<input type="date" id="corte"></label>
      <label class="f" for="umbral">Por vencer (días)<input type="number" id="umbral" min="0" max="60" value="3"></label>
      <input type="file" id="file" accept=".xlsx,.xls" hidden>
      <button class="btn" id="btnLoad" type="button" title="Abre el Excel “Seguimiento de Solpeds” en su navegador">Cargar reporte nuevo</button>
    </div>
  </header>
  <div class="msg" id="loadMsg" hidden></div>
  <div class="pubbar" id="pubBar" hidden>
    <span>Este reporte solo se ve en su navegador. Para que todos los que abran el enlace lo vean, publíquelo:</span>
    <label class="f" for="clave">Clave de administrador<input type="password" id="clave" autocomplete="current-password"></label>
    <button class="btn primary" id="btnPub" type="button">Publicar para todos</button>
    <span class="msg" id="pubMsg"></span>
  </div>

  <div class="filters" id="filters">
    <label class="f">Sucursal<div class="ms" id="ms-suc"></div></label>
    <label class="f">Tipo de solicitud<div class="ms" id="ms-tipo"></div></label>
    <label class="f">Clúster<div class="ms" id="ms-clu"></div></label>
    <label class="f">Categoría<div class="ms" id="ms-cat"></div></label>
    <label class="f" for="d1">SOLPED desde<input type="date" id="d1"></label>
    <label class="f" for="d2">SOLPED hasta<input type="date" id="d2"></label>
    <label class="f" for="fsp">N.º SOLPED<input type="search" id="fsp" placeholder="Ej.: SP202604-00941, 00942" style="width:230px"></label>
    <button class="btn" id="btnClear" type="button">Limpiar filtros</button>
  </div>
  <div class="chips" id="chips"></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-cump" aria-selected="true">Cumplimiento de OC</button>
    <button class="tab" role="tab" id="t-ab" aria-selected="false">OC abiertas: vencidas y por vencer</button>
    <button class="tab" role="tab" id="t-ciclo" aria-selected="false">Ciclo de OC cerradas</button>
    <button class="tab" role="tab" id="t-etapas" aria-selected="false">Etapas del ciclo</button>
    <button class="tab" role="tab" id="t-curso" aria-selected="false">Ciclos en curso</button>
    <button class="tab" role="tab" id="t-res" aria-selected="false">Resumen por sucursal y tipo</button>
  </nav>

  <section class="panel" id="p-cump"></section>
  <section class="panel" id="p-ab" hidden></section>
  <section class="panel" id="p-ciclo" hidden></section>
  <section class="panel" id="p-etapas" hidden></section>
  <section class="panel" id="p-curso" hidden></section>
  <section class="panel" id="p-res" hidden></section>
</div>
<div id="tip" hidden></div>
<div id="loading">Cargando 82.702 líneas de SOLPED…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ============================ utilidades ============================ */
const $ = s => document.querySelector(s);
const DAY = 864e5;
const fmtN = new Intl.NumberFormat('es-EC',{maximumFractionDigits:0});
const fmt1 = new Intl.NumberFormat('es-EC',{minimumFractionDigits:1,maximumFractionDigits:1});
const n0 = v => v==null||isNaN(v)?'—':fmtN.format(v);
const n1 = v => v==null||isNaN(v)?'—':fmt1.format(v);
const pct = (a,b) => b? fmt1.format(100*a/b)+'%' : '—';
const dstr = d => { if(d==null) return ''; const t=new Date(d*DAY); return String(t.getUTCDate()).padStart(2,'0')+'/'+String(t.getUTCMonth()+1).padStart(2,'0')+'/'+t.getUTCFullYear(); };
const diso = d => d==null?'':new Date(d*DAY).toISOString().slice(0,10);
const fromIso = s => s? Math.round(Date.parse(s+'T00:00:00Z')/DAY) : null;
const mes = d => { const t=new Date(d*DAY); return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0'); };
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const mesLbl = m => MESES[+m.slice(5)-1]+' '+m.slice(2,4);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function median(a){ if(!a.length) return null; const s=Float64Array.from(a).sort(); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function quant(a,q){ if(!a.length) return null; const s=Float64Array.from(a).sort(); return s[Math.min(s.length-1,Math.floor(q*(s.length-1)))]; }
const mean = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : null;

/* ============================ modelo ============================ */
const PRE = {'PENDIENTE':'SOLPED por aprobar','CODIGO PENDIENTE':'SOLPED por aprobar','CANTIDAD APROBADA':'En gestión de compras','PETICIÓN DE OFERTAS':'En gestión de compras','COTIZADO':'En gestión de compras','PRECIO APROBADO':'OC en aprobación','OC APROBADA':'OC en aprobación'};
const REQ = ['Estado','Solped','Clúster','Sucursal','Tipo Solicitud','Fecha solped.','Fecha Aprob','Fecha OC','OC ERP','Fecha de entrega','Ult. Fecha Ingr. Bod','Cant. Orden Compra','Cant. Ingreso','Cantidad Pendiente'];
let M = null;           // modelo
let S = {corte:null, umbral:3, suc:null, tipo:null, clu:null, cat:null, sp:null, d1:null, d2:null, tab:'cump'};

function buildModel(L){
  // L: array de líneas normalizadas
  const ocs = new Map();
  const CATN={'MATERIAL':'Material','SERVICIO':'Servicio','ACTIVO':'Activo'};
  for(const l of L){
    l.cat = CATN[l.cat] || l.cat || '(sin categoría)';
    l.pre = PRE[l.est] || null;
    l.aprob = l.fAp!=null;
    l.atend = (l.oc!=null && l.est!=='OC ANULADA') || l.est==='CONTRATO GENERADO' || l.est==='CONTRATO MARCO';
    l.abierta = (l.est==='OC GENERADA'||l.est==='INGRESO PARCIAL') && l.qPend>0;
    l.parcial = l.abierta && l.qIng>0;
    if(l.oc!=null){
      let o = ocs.get(l.oc);
      if(!o){ o={oc:l.oc, suc:l.suc, tipo:l.tipo, clu:l.clu, prov:l.prov, comp:l.comp, sp:l.sp, cat:l.cat, fSP:l.fSP, fAp:l.fAp, fOC:l.fOC, fIng:null, n:0, nAb:0, nIT:0, nIP:0, nAn:0, nPar:0, lines:[]}; ocs.set(l.oc,o); }
      o.n++; o.lines.push(l);
      if(l.fSP!=null && (o.fSP==null||l.fSP<o.fSP)) o.fSP=l.fSP;
      if(l.fAp!=null && (o.fAp==null||l.fAp<o.fAp)) o.fAp=l.fAp;
      if(l.fOC!=null && (o.fOC==null||l.fOC<o.fOC)) o.fOC=l.fOC;
      if(l.fIng!=null && (o.fIng==null||l.fIng>o.fIng)) o.fIng=l.fIng;
      if(l.abierta) o.nAb++;
      if(l.parcial) o.nPar++;
      if(l.est==='OC CERRADA (IT)') o.nIT++;
      if(l.est==='OC CERRADA (IP)') o.nIP++;
      if(l.est==='OC ANULADA') o.nAn++;
    }
  }
  for(const o of ocs.values()){
    o.estado = o.nAb>0 ? 'Abierta' : (o.nAn===o.n ? 'Anulada' : (o.nIP>0 ? 'Cerrada administrativa' : (o.nIT>0 ? 'Cerrada con ingreso total' : 'Abierta')));
    if(o.estado==='Abierta' && o.nAb===0) o.estado='Cerrada administrativa';
    o.tAt = (o.fOC!=null&&o.fAp!=null)? o.fOC-o.fAp : null;
    if(o.estado==='Cerrada con ingreso total' && o.fIng!=null && o.fSP!=null){
      o.ciclo = o.fIng-o.fSP; o.t1 = o.fAp!=null? o.fAp-o.fSP : null; o.t2 = (o.fAp!=null&&o.fOC!=null)? o.fOC-o.fAp : null; o.t3 = o.fOC!=null? o.fIng-o.fOC : null;
    }
  }
  const uniq = k => { const m=new Map(); for(const l of L){ m.set(l[k],(m.get(l[k])||0)+1);} return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]); };
  let maxD = 0; for(const l of L){ for(const d of [l.fSP,l.fIng,l.fOC]) if(d!=null&&d>maxD) maxD=d; }
  return {L, ocs:[...ocs.values()], dims:{suc:uniq('suc'), tipo:uniq('tipo'), clu:uniq('clu'), cat:uniq('cat')}, maxD};
}

/* plazo por corte */
function plazo(l){
  if(l.fEnt==null) return {st:'Sin fecha', d:null};
  const d = l.fEnt - S.corte;
  if(d<0) return {st:'Vencida', d};
  if(d<=S.umbral) return {st:'Por vencer', d};
  return {st:'Dentro del plazo', d};
}
const RANK = {'Vencida':4,'Sin fecha':3,'Por vencer':2,'Dentro del plazo':1};

/* ============================ filtros ============================ */
const pass = x => (!S.suc||S.suc.has(x.suc)) && (!S.tipo||S.tipo.has(x.tipo)) && (!S.clu||S.clu.has(x.clu)) && (!S.cat||S.cat.has(x.cat)) && (!S.sp||S.sp.some(t=>x.sp.includes(t))) && (S.d1==null||(x.fSP!=null&&x.fSP>=S.d1)) && (S.d2==null||(x.fSP!=null&&x.fSP<=S.d2));
function filtered(){ return {L:M.L.filter(pass), O:M.ocs.filter(pass)}; }

const MS = {};
function makeMS(id,key,label){
  const host=$('#ms-'+id); host.innerHTML='';
  const btn=document.createElement('button'); btn.type='button'; btn.className='ms-btn'; btn.id='msb-'+id; btn.setAttribute('aria-haspopup','listbox');
  const pop=document.createElement('div'); pop.className='ms-pop'; pop.hidden=true;
  pop.innerHTML=`<input type="search" placeholder="Buscar ${label.toLowerCase()}" id="mss-${id}"><div class="ms-acts"><button type="button" class="btn" data-a="all">Todas</button><button type="button" class="btn" data-a="none">Ninguna</button></div><div class="ms-list" role="listbox"></div>`;
  host.append(btn,pop);
  const list=pop.querySelector('.ms-list'), q=pop.querySelector('input');
  const render=()=>{
    // conteos dinámicos con los otros filtros
    const other = {...S}; other[key]=null;
    const cnt=new Map();
    for(const l of M.L){ if((key==='suc'||!other.suc||other.suc.has(l.suc))&&(key==='tipo'||!other.tipo||other.tipo.has(l.tipo))&&(key==='clu'||!other.clu||other.clu.has(l.clu))&&(key==='cat'||!other.cat||other.cat.has(l.cat))&&(!S.sp||S.sp.some(t=>l.sp.includes(t)))&&(S.d1==null||(l.fSP!=null&&l.fSP>=S.d1))&&(S.d2==null||(l.fSP!=null&&l.fSP<=S.d2))) cnt.set(l[key],(cnt.get(l[key])||0)+1); }
    const term=q.value.trim().toLowerCase();
    const vals=M.dims[key].filter(v=>!term||String(v).toLowerCase().includes(term)).sort((a,b)=>(cnt.get(b)||0)-(cnt.get(a)||0));
    list.innerHTML=vals.map((v,i)=>{ const c=cnt.get(v)||0; const ch=!S[key]||S[key].has(v); return `<label class="${c?'':'zero'}"><input type="checkbox" data-v="${esc(v)}" ${ch?'checked':''}> <span>${esc(v||'(vacío)')}</span><span class="cnt">${n0(c)}</span></label>`; }).join('');
  };
  const sync=()=>{
    const sel=S[key];
    btn.textContent = !sel ? `Todas (${M.dims[key].length})` : (sel.size===1 ? [...sel][0] : `${sel.size} seleccionadas`);
    btn.classList.toggle('on',!!sel);
  };
  btn.onclick=e=>{ e.preventDefault(); e.stopPropagation(); const open=pop.hidden; document.querySelectorAll('.ms-pop').forEach(p=>p.hidden=true); pop.hidden=!open; if(open){ render(); q.focus(); } };
  q.oninput=render;
  pop.addEventListener('click',e=>e.stopPropagation());
  list.addEventListener('change',e=>{
    const v=e.target.dataset.v; let sel=S[key]? new Set(S[key]) : new Set(M.dims[key]);
    e.target.checked? sel.add(v) : sel.delete(v);
    S[key] = sel.size===M.dims[key].length ? null : sel; sync(); refresh();
  });
  pop.querySelector('[data-a=all]').onclick=()=>{ S[key]=null; render(); sync(); refresh(); };
  pop.querySelector('[data-a=none]').onclick=()=>{ S[key]=new Set(); render(); sync(); refresh(); };
  MS[key]={sync,render}; sync();
}

/* ============================ gráficos SVG ============================ */
function barChart({cats, vals, labels, tips, colors, yMax, yFmt=n0, h=230, unit='', W=760}){
  W=Math.max(320,Math.round(W));
  const L=46, R=12, T=14, B=36, ih=h-T-B, iw=W-L-R;
  const mx = yMax ?? Math.max(1,...vals);
  const step = niceStep(mx/4); const top=Math.ceil(mx/step)*step || 1;
  const bw = iw/cats.length, gap=Math.max(2,Math.min(10,bw*.25));
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  for(let v=0; v<=top+1e-9; v+=step){ const y=T+ih-ih*v/top; s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${yFmt(v)}${unit}</text>`; }
  cats.forEach((c,i)=>{ const v=vals[i]||0, x=L+i*bw+gap/2, w=bw-gap, bh=ih*v/top, y=T+ih-bh;
    s+=`<g data-tip="${esc(tips[i])}"><rect x="${x-gap/2}" y="${T}" width="${bw}" height="${ih}" fill="transparent"/><path d="${roundTop(x,y,w,bh)}" fill="${colors? colors[i]:'var(--s1)'}"/></g>`;
    if(labels&&labels[i]!=null&&bw>26) s+=`<text x="${x+w/2}" y="${y-5}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${labels[i]}</text>`;
    s+=`<text x="${x+w/2}" y="${h-B+16}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(c)}</text>`; });
  s+=`<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--axis)"/></svg>`;
  return s;
}
function roundTop(x,y,w,h){ if(h<=0) return ''; const r=Math.min(4,w/2,h); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function niceStep(x){ if(x<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }

function stackBar(parts, W=760){ // parts: [{lab,val,color}]
  W=Math.max(320,Math.round(W)); const h=70, L=0, iw=W; const tot=parts.reduce((a,p)=>a+(p.val||0),0)||1;
  let x=0, s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  parts.forEach((p,i)=>{ const w=iw*(p.val||0)/tot; const gap= i<parts.length-1?2:0;
    s+=`<g data-tip="${esc(p.tip)}"><rect x="${x}" y="8" width="${Math.max(0,w-gap)}" height="30" rx="${i===0||i===parts.length-1?4:0}" fill="${p.color}"/></g>`;
    if(w>90) s+=`<text x="${x+8}" y="58" font-size="12" fill="var(--ink-2)">${esc(p.lab)} · ${n1(p.val)} d</text>`;
    x+=w; });
  return s+'</svg>';
}

const TB={};
function table(id, cols, rows, {pageSize=50, sortKey=null, sortDir=-1, total=null, note=''}={}){
  const st = TB[id] || (TB[id]={page:0, sortKey, sortDir, q:''});
  const host=$('#'+id);
  const term=st.q.toLowerCase();
  let R = term? rows.filter(r=>cols.some(c=>String(c.get(r)??'').toLowerCase().includes(term))) : rows.slice();
  if(st.sortKey!=null){ const c=cols.find(c=>c.k===st.sortKey); if(c){ const g=c.sv||c.get; R.sort((a,b)=>{ const x=g(a), y=g(b); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (x<y?-1:x>y?1:0)*st.sortDir; }); } }
  const pages=Math.max(1,Math.ceil(R.length/pageSize)); st.page=Math.min(st.page,pages-1);
  const slice=R.slice(st.page*pageSize,(st.page+1)*pageSize);
  host.innerHTML = `<div class="tbar"><div class="left"><input type="search" placeholder="Buscar en la tabla" value="${esc(st.q)}" id="${id}-q" aria-label="Buscar en la tabla"><span class="msg">${n0(R.length)} filas</span></div><button class="btn" type="button" id="${id}-copy">Copiar para Excel</button></div>
  <div class="tbl"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}" data-k="${c.k}">${esc(c.h)}${st.sortKey===c.k?`<span class="ar">${st.sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead>
  <tbody>${slice.map(r=>`<tr>${cols.map(c=>`<td class="${(c.num?'num ':'')+(c.cls||'')}">${c.html? c.html(r) : esc(c.fmt? c.fmt(c.get(r)) : c.get(r))}</td>`).join('')}</tr>`).join('')}
  ${total && st.page===pages-1 ? `<tr class="total">${cols.map(c=>`<td class="${c.num?'num':''}">${total[c.k]??''}</td>`).join('')}</tr>`:''}</tbody></table></div>
  <div class="pager">${pages>1?`<button class="btn" type="button" id="${id}-prev" ${st.page?'':'disabled'}>Anterior</button><span>Página ${st.page+1} de ${pages}</span><button class="btn" type="button" id="${id}-next" ${st.page<pages-1?'':'disabled'}>Siguiente</button>`:''}${note?`<span class="note">${note}</span>`:''}<span class="msg" id="${id}-cmsg"></span></div>`;
  host.querySelectorAll('th').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(st.sortKey===k) st.sortDir*=-1; else { st.sortKey=k; st.sortDir=-1; } st.page=0; table(id,cols,rows,{pageSize,total,note}); });
  const q=$(`#${id}-q`); q.oninput=()=>{ st.q=q.value; st.page=0; table(id,cols,rows,{pageSize,total,note}); const nq=$(`#${id}-q`); nq.focus(); nq.setSelectionRange(nq.value.length,nq.value.length); };
  if(pages>1){ $(`#${id}-prev`).onclick=()=>{st.page--; table(id,cols,rows,{pageSize,total,note});}; $(`#${id}-next`).onclick=()=>{st.page++; table(id,cols,rows,{pageSize,total,note});}; }
  $(`#${id}-copy`).onclick=()=>{
    const lines=[cols.map(c=>c.h).join('\t')].concat(R.map(r=>cols.map(c=>{ let v=c.get(r); if(v==null) return ''; if(c.date) return dstr(v); if(typeof v==='number') return String(Math.round(v*100)/100).replace('.',','); return String(v).replace(/[\t\n]/g,' '); }).join('\t')));
    const txt=lines.join('\n'), m=$(`#${id}-cmsg`);
    const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.append(ta); ta.select(); try{ document.execCommand('copy'); m.textContent='Copiado: pegue en Excel.'; }catch(_){ m.textContent='No se pudo copiar.'; } ta.remove(); };
    try{ navigator.clipboard.writeText(txt).then(()=>m.textContent=`Copiadas ${n0(R.length)} filas: pegue en Excel.`, fallback); }catch(_){ fallback(); }
  };
}

/* ---------- Etapas del ciclo ---------- */
const ETAPAS=[
  {k:'e1',h:'Aprob. cantidad',d:'SOLPED creada → cantidad aprobada'},
  {k:'e2',h:'Cotización',d:'Cantidad aprobada → preorden; incluye la espera hasta que el comprador atiende'},
  {k:'e3',h:'Aprob. precio',d:'Preorden → precio aprobado'},
  {k:'e4',h:'Aprobador OC1',d:'Precio aprobado → primera aprobación de la OC'},
  {k:'e5',h:'Aprobador OC2',d:'Primera → segunda aprobación (0 si la OC tiene un solo aprobador)'},
  {k:'e6',h:'Generación OC',d:'Última aprobación → OC generada en SAP'},
  {k:'e7',h:'Ingreso bodega',d:'OC generada → último ingreso a bodega de la posición'}];
function stagesOf(l){
  if(l._s!==undefined) return l._s;
  let r=null;
  if(l.est==='OC CERRADA (IT)' && l.qIng>0){
    const c=[l.tSP,l.tAp,l.tPre,l.tPr,l.tA1,l.tA2,l.tOC,l.tIng];
    if(c[0]!=null && c[7]!=null){ for(let i=1;i<8;i++) if(c[i]==null) c[i]=c[i-1]; r=[]; for(let i=0;i<7;i++) r.push((c[i+1]-c[i])/1440); r.push((c[7]-c[0])/1440); }
  }
  l._s=r; return r;
}
const f2=new Intl.NumberFormat('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});
const n2=v=>v==null||isNaN(v)?'—':f2.format(v);
function renderEtapas(F){
  const G={mesSP:['Mes de SOLPED',l=>mes(l.fSP)],mesOC:['Mes de OC',l=>mes(l.fOC)],mesIng:['Mes de ingreso',l=>mes(l.fIng)],suc:['Sucursal',l=>l.suc],tipo:['Tipo de solicitud',l=>l.tipo],clu:['Clúster',l=>l.clu],cat:['Categoría',l=>l.cat],comp:['Comprador',l=>l.comp]};
  const gk=S.etG||'mesOC', met=S.etM||'prom';
  const agg=met==='prom'? (a=>mean(a)) : (a=>median(a));
  const groups=new Map(), all=Array.from({length:8},()=>[]);
  let n=0;
  for(const l of F.L){ const s=stagesOf(l); if(!s) continue; n++;
    const k=G[gk][1](l); let g=groups.get(k); if(!g){ g={k, a:Array.from({length:8},()=>[])}; groups.set(k,g); }
    for(let i=0;i<8;i++){ g.a[i].push(s[i]); all[i].push(s[i]); } }
  const rows=[...groups.values()].map(g=>{ const o={k:g.k, n:g.a[0].length}; for(let i=0;i<8;i++) o['e'+(i+1)]=agg(g.a[i]); o.tot=o.e8; return o; });
  const tot={}; for(let i=0;i<8;i++) tot['e'+(i+1)]=agg(all[i]);
  const stVals=ETAPAS.map((e,i)=>tot['e'+(i+1)]||0);
  const iMax=stVals.indexOf(Math.max(...stVals)), sumSt=stVals.reduce((a,b)=>a+b,0);
  const gestion=stVals.slice(0,6).reduce((a,b)=>a+b,0);
  const colMax={}; ETAPAS.forEach((e,i)=>{ colMax[e.k]=Math.max(0,...rows.map(r=>r[e.k]||0)); }); colMax.tot=Math.max(0,...rows.map(r=>r.tot||0));
  const isMonth=gk.startsWith('mes');
  $('#p-etapas').innerHTML=`
  <p class="lead">Tiempo de cada etapa del proceso, en días con decimales calculados con fecha y hora, para las posiciones de OC cerradas con ingreso total. Aplica los filtros de sucursal, tipo de solicitud, clúster, categoría y fechas de SOLPED. ${met==='prom'?'Con promedios, las etapas suman el ciclo total.':'Las medianas de cada etapa no suman la mediana del ciclo total.'}</p>
  <ul class="defs">${ETAPAS.map(e=>`<li><b>${e.h}</b>${e.d}</li>`).join('')}</ul>
  <div class="tiles">
    <div class="tile hero"><span class="k">Ciclo total ${met==='prom'?'promedio':'mediana'}</span><span class="v">${n2(tot.e8)} d</span><span class="d">${n0(n)} posiciones cerradas con ingreso total</span></div>
    <div class="tile"><span class="k">Etapa con mayor demora</span><span class="v">${ETAPAS[iMax].h}</span><span class="d">${n2(stVals[iMax])} días${met==='prom'?` · ${pct(stVals[iMax],sumSt)} del ciclo`:''}</span></div>
    <div class="tile"><span class="k">Gestión hasta generar la OC</span><span class="v">${n2(gestion)} d</span><span class="d">Aprob. cantidad a generación OC${met==='prom'?` · ${pct(gestion,sumSt)} del ciclo`:''}</span></div>
    <div class="tile"><span class="k">Ingreso bodega</span><span class="v">${n2(stVals[6])} d</span><span class="d">De la OC al último ingreso${met==='prom'?` · ${pct(stVals[6],sumSt)} del ciclo`:''}</span></div>
  </div>
  <div class="card"><h2>Días por etapa</h2><p class="sub">${met==='prom'?'Promedio':'Mediana'} de días de cada etapa con los filtros activos; en rojo, la etapa con mayor demora.</p><div class="chart" id="ch-et"></div></div>
  <div class="card"><h2>Etapas por ${G[gk][0].replace(/^./,c=>c.toLowerCase())}</h2><p class="sub">Días ${met==='prom'?'promedio':'mediana'} por etapa. El sombreado indica qué grupo demora más en cada etapa; subrayada en rojo, la etapa más lenta de cada fila.</p>
    <div class="ctl"><label class="f" for="etG">Agrupar por<select id="etG">${Object.entries(G).map(([k,v])=>`<option value="${k}" ${k===gk?'selected':''}>${v[0]}</option>`).join('')}</select></label>
    <div class="seg" role="group" aria-label="Medida" id="segEt"><button type="button" data-v="prom" aria-pressed="${met==='prom'}">Promedio</button><button type="button" data-v="med" aria-pressed="${met==='med'}">Mediana</button></div></div>
    <div id="tb-et" style="margin-top:10px"></div></div>`;
  $('#ch-et').innerHTML=barChart({W:$('#ch-et').clientWidth, cats:ETAPAS.map(e=>e.h), vals:stVals, labels:stVals.map(n2), yFmt:v=>fmt1.format(v),
    tips:ETAPAS.map((e,i)=>`<b>${e.h}</b><br>${n2(stVals[i])} días${met==='prom'?`<br>${pct(stVals[i],sumSt)} del ciclo total`:''}<br><span style="opacity:.8">${e.d}</span>`),
    colors:stVals.map((_,i)=>i===iMax?'var(--crit)':'var(--s1)')});
  bindTips($('#ch-et'));
  $('#etG').onchange=e=>{ S.etG=e.target.value; delete TB['tb-et']; renderEtapas(F); };
  $('#segEt').onclick=e=>{ const v=e.target.dataset.v; if(!v) return; S.etM=v; renderEtapas(F); };
  const heat=(r,k)=>{ const v=r[k]; if(v==null) return '—'; const m=colMax[k]||1; const a=Math.round(Math.max(0,Math.min(1,v/m))*38);
    let mx=-1,mk=null; ETAPAS.forEach(e=>{ if((r[e.k]??-1)>mx){mx=r[e.k];mk=e.k;} });
    return `<div style="background:color-mix(in srgb,var(--crit) ${a}%,transparent);margin:-6px -9px;padding:6px 9px" class="${k===mk?'':''}">${k===mk?`<b style="box-shadow:inset 0 -2px 0 var(--crit)">${n2(v)}</b>`:n2(v)}</div>`; };
  const cols=[{k:'k',h:G[gk][0],get:r=>r.k,fmt:v=>isMonth?mesLbl(v):v}, {k:'n',h:'Posiciones',get:r=>r.n,num:1,fmt:n0}]
    .concat(ETAPAS.map(e=>({k:e.k,h:e.h,get:r=>r[e.k],num:1,html:r=>heat(r,e.k)})))
    .concat([{k:'tot',h:'Ciclo total',get:r=>r.tot,num:1,html:r=>`<b>${n2(r.tot)}</b>`}]);
  const total={k:'Total',n:n0(n),tot:n2(tot.e8)}; ETAPAS.forEach((e,i)=>total[e.k]=n2(tot['e'+(i+1)]));
  table('tb-et',cols,rows,{sortKey:TB['tb-et']?.sortKey||(isMonth?'k':'n'),pageSize:200,total});
  if(isMonth && !TB['tb-et']._init){ TB['tb-et'].sortDir=1; TB['tb-et']._init=1; table('tb-et',cols,rows,{pageSize:200,total}); }
}

function renderCurso(F){

  for(const o of F.O.filter(o=>o.estado==='Abierta')){
    let worst='Dentro del plazo'; for(const l of o.lines) if(l.abierta){ const p=plazo(l).st; if(RANK[p]>RANK[worst]) worst=p; }
    rows.push({ref:o.oc, sp:o.sp, etapa:o.nPar>0?'OC con ingreso parcial':'OC emitida, sin ingreso', suc:o.suc, tipo:o.tipo, clu:o.clu, cat:o.cat, prov:o.prov, comp:o.comp, fSP:o.fSP, desde:o.fOC, plazo:worst, n:o.nAb});
  }
  const g=new Map();
  for(const l of F.L) if(l.pre){ const k=l.sp+'|'+l.pre; let r=g.get(k); if(!r){ r={ref:'—', sp:l.sp, etapa:l.pre, suc:l.suc, tipo:l.tipo, clu:l.clu, cat:l.cat, prov:l.prov||'', comp:l.comp, fSP:l.fSP, desde: l.pre==='SOLPED por aprobar'? l.fSP : l.pre==='En gestión de compras'? l.fAp : (l.fPr??l.fAt), plazo:'', n:0}; g.set(k,r);} r.n++; }
  rows.push(...g.values());
  for(const r of rows){ r.dTot = r.fSP!=null? S.corte-r.fSP : null; r.dEt = r.desde!=null? S.corte-r.desde : null; }
  const ET=['SOLPED por aprobar','En gestión de compras','OC en aprobación','OC emitida, sin ingreso','OC con ingreso parcial'];

  <div class="tiles">${st.map((s,i)=>`<div class="tile${i===3?' hero':''}"><span class="k">${s.e}</span><span class="v">${n0(s.n)}</span><span class="d">${s.n?`${n1(s.d)} días promedio desde la SOLPED`:'sin casos'}</span></div>`).join('')}</div>
  <div class="card"><h2>Antigüedad promedio por etapa</h2><p class="sub">Días desde la SOLPED a la fecha de corte; la etiqueta indica cuántos casos hay en cada etapa.</p><div class="chart" id="ch-curso"></div></div>
  <div class="card"><h2>Detalle de ciclos en curso</h2><p class="sub">“Días en la etapa” se mide desde la fecha en que empezó la etapa actual (aprobación, atención o fecha OC).</p><div id="tb-curso"></div></div>`;
  $('#ch-curso').innerHTML=barChart({W:$('#ch-curso').clientWidth,cats:st.map(s=>s.e.replace('SOLPED ','').replace(' de compras','').replace(', sin ingreso','').replace('OC con ingreso parcial','Ingreso parcial')), vals:st.map(s=>s.d||0), labels:st.map(s=>`${n0(s.n)} casos`), tips:st.map(s=>`<b>${s.e}</b><br>${n0(s.n)} casos<br>${n1(s.d)} días promedio desde la SOLPED`), unit:' d'});
  bindTips($('#ch-curso'));
  table('tb-curso',[
    {k:'etapa',h:'Etapa actual',get:r=>r.etapa,sv:r=>ET.indexOf(r.etapa)},
    {k:'ref',h:'OC',get:r=>r.ref,cls:'mono'},{k:'sp',h:'SOLPED',get:r=>r.sp,cls:'mono'},
    {k:'n',h:'Posiciones',get:r=>r.n,num:1,fmt:n0},
    {k:'suc',h:'Sucursal',get:r=>r.suc},{k:'tipo',h:'Tipo de solicitud',get:r=>r.tipo},{k:'clu',h:'Clúster',get:r=>r.clu},{k:'cat',h:'Categoría',get:r=>r.cat},
    {k:'prov',h:'Proveedor',get:r=>r.prov},{k:'comp',h:'Comprador',get:r=>r.comp},
    {k:'fsp',h:'Fecha SOLPED',get:r=>r.fSP,fmt:dstr,date:1},
    {k:'dTot',h:'Días desde SOLPED',get:r=>r.dTot,num:1,fmt:n0},

function agg(F,key){
  const m=new Map();
  const get=k=>{ let r=m.get(k); if(!r){ r={k, ap:0, at:0, oc:0, it:0, ab:0, venc:0, pv:0, tAt:[], cic:[]}; m.set(k,r);} return r; };
  for(const l of F.L){ const r=get(l[key]); if(l.aprob) r.ap++; if(l.aprob&&l.atend) r.at++; }
  for(const o of F.O){ if(o.estado==='Anulada') continue; const r=get(o[key]); r.oc++; if(o.estado==='Cerrada con ingreso total'){ r.it++; if(o.ciclo!=null) r.cic.push(o.ciclo);} if(o.tAt!=null) r.tAt.push(o.tAt);
    if(o.estado==='Abierta'){ r.ab++; let w='Dentro del plazo'; for(const l of o.lines) if(l.abierta){ const p=plazo(l).st; if(RANK[p]>RANK[w]) w=p; } if(w==='Vencida') r.venc++; else if(w==='Por vencer') r.pv++; } }
  return [...m.values()];
}

    {k:'venc',h:'Abiertas vencidas',get:r=>r.venc,num:1,fmt:n0},
    {k:'pv',h:'Por vencer',get:r=>r.pv,num:1,fmt:n0},
    {k:'ap',h:'Líneas SP aprobadas',get:r=>r.ap,num:1,fmt:n0},
    {k:'at',h:'Líneas atendidas',get:r=>r.at,num:1,fmt:n0},
    {k:'pat',h:'% atención',get:r=>P(r.at,r.ap),num:1,html:r=>meter(P(r.at,r.ap))},
    {k:'tat',h:'Atención SP aprobada → OC prom. (d)',get:r=>mean(r.tAt),num:1,fmt:n1},
    {k:'tatm',h:'Atención SP aprobada → OC mediana (d)',get:r=>median(r.tAt),num:1,fmt:n1},
    {k:'cic',h:'Ciclo total prom. (d)',get:r=>mean(r.cic),num:1,fmt:n1},
    {k:'cicm',h:'Ciclo total mediana (d)',get:r=>median(r.cic),num:1,fmt:n1}], rows,
    {sortKey:TB['tb-res']?.sortKey||'oc', pageSize:200,
     total:{k:'Total',oc:n0(T.oc),it:n0(T.it),cum:pct(T.it,T.oc),ab:n0(T.ab),venc:n0(T.venc),pv:n0(T.pv),ap:n0(T.ap),at:n0(T.at),pat:pct(T.at,T.ap),tat:n1(mean(T.tAt)),tatm:n1(median(T.tAt)),cic:n1(mean(T.cic)),cicm:n1(median(T.cic))}});

function setModel(model, fuente, corte){
  M=model; S.corte=corte; S.suc=S.tipo=S.clu=S.cat=S.sp=null; $('#fsp').value=''; S.d1=S.d2=null;
  $('#corte').value=diso(corte); $('#d1').value=$('#d2').value='';
  $('#src').textContent=`${fuente} · ${n0(M.L.length)} líneas de SOLPED · ${n0(M.ocs.length)} OC · días calendario`;
  makeMS('suc','suc','Sucursal'); makeMS('tipo','tipo','Tipo de solicitud'); makeMS('clu','clu','Clúster'); makeMS('cat','cat','Categoría');
  for(const k in TB) delete TB[k];
  refresh();
}

/* datos incluidos */
const mday = m => m==null?null:Math.floor(m/1440);
function derive(o){ o.fSP=mday(o.tSP); o.fAp=mday(o.tAp); o.fPr=mday(o.tPr); o.fOC=mday(o.tOC); o.fIng=mday(o.tIng); }
function fromColumnar(D){
  const C=D.cols, n=D.n;
  const col=(name)=>{ const c=C[name]; if(!c) return ()=>null; if(c.t==='s') return i=>c.dict[c.v[i]] ?? ''; if(c.t==='ts'){ const b=c.base/c.u; return i=>c.v[i]==null?null:(c.v[i]+b)*c.u; } return i=>c.v[i]; };
  const g={est:col('Estado'),sp:col('Solped'),clu:col('Clúster'),suc:col('Sucursal'),tipo:col('Tipo Solicitud'),cat:col('Categoría'),comp:col('Comprador(a)'),prov:col('Proveedor'),cod:col('Código'),item:col('Nombre de Item'),
    tSP:col('Fecha solped.'),tAp:col('Fecha Aprob'),fAt:col('Fecha atención comprador'),tPre:col('Fecha Preorden'),tPr:col('Fecha Aprob Precio'),tA1:col('Fecha Aprob 1 OC'),tA2:col('Fecha Aprob 2 OC'),tOC:col('Fecha OC'),oc:col('OC ERP'),fEnt:col('Fecha de entrega'),tIng:col('Ult. Fecha Ingr. Bod'),qOC:col('Cant. Orden Compra'),qIng:col('Cant. Ingreso'),qPend:col('Cantidad Pendiente')};
  const L=new Array(n);
  for(let i=0;i<n;i++){ const o={}; for(const k in g) o[k]=g[k](i); if(o.oc!=null) o.oc=String(o.oc); derive(o); L[i]=o; }
  return L;
}

/* publicación compartida (Cloudflare Pages Functions + KV) */
let API=false, LAST=null;
const COLMAP=[['Estado','s','est'],['Solped','s','sp'],['Clúster','s','clu'],['Sucursal','s','suc'],['Tipo Solicitud','s','tipo'],['Categoría','s','cat'],['Comprador(a)','s','comp'],['Proveedor','s','prov'],['Código','s','cod'],['Nombre de Item','s','item'],
  ['Fecha solped.','ts','tSP'],['Fecha Aprob','ts','tAp'],['Fecha atención comprador','d','fAt'],['Fecha Preorden','ts','tPre'],['Fecha Aprob Precio','ts','tPr'],['Fecha Aprob 1 OC','ts','tA1'],['Fecha Aprob 2 OC','ts','tA2'],['Fecha OC','ts','tOC'],['OC ERP','n','oc'],
  ['Fecha de entrega','d','fEnt'],['Ult. Fecha Ingr. Bod','ts','tIng'],['Cant. Orden Compra','n','qOC'],['Cant. Ingreso','n','qIng'],['Cantidad Pendiente','n','qPend']];
function toColumnar(L, fuente, corte){
  const BASE=28928160; // minutos al 01/01/2025
  const out={n:L.length, cols:{}, corte, fuente};
  for(const [name,t,k] of COLMAP){
    if(t==='s'){ const dict=[], idx=new Map(), v=new Array(L.length); L.forEach((l,i)=>{ const x=l[k]==null?'':String(l[k]); let j=idx.get(x); if(j===undefined){ j=dict.length; dict.push(x); idx.set(x,j);} v[i]=j; }); out.cols[name]={t:'s',dict,v}; }
    else if(t==='ts') out.cols[name]={t:'ts',base:BASE,u:10,v:L.map(l=>l[k]==null?null:Math.floor(l[k]/10)-BASE/10)};
    else if(t==='d') out.cols[name]={t:'d',v:L.map(l=>l[k]==null?null:l[k])};
    else out.cols[name]={t:'n',v:L.map(l=>l[k]==null?null:(k==='oc'?Number(l[k]):l[k]))};
  }
  return out;
}
$('#btnPub').onclick=async()=>{
  const m=$('#pubMsg'), clave=$('#clave').value;
  if(!LAST){ m.textContent='Primero cargue un reporte.'; return; }
  if(!clave){ m.textContent='Ingrese la clave de administrador.'; return; }
  const ahora=new Date();
  const fuente=`${LAST.fuente} – corte ${dstr(S.corte)} – publicado ${ahora.toLocaleDateString('es-EC')} ${ahora.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})}`;
  m.className='msg'; m.textContent='Publicando…'; $('#btnPub').disabled=true;
  try{
    const body=JSON.stringify(toColumnar(LAST.L, fuente, S.corte));
    const r=await fetch('api/datos',{method:'PUT',headers:{'content-type':'application/json','x-clave-admin':clave},body});
    const txt=await r.text();
    if(!r.ok) throw new Error(r.status===401?'Clave incorrecta.':txt||('Error '+r.status));
    m.textContent='Publicado. Quien abra el enlace verá estos datos (puede tardar hasta 1 minuto en propagarse).';
    $('#src').textContent=`${fuente} · ${n0(M.L.length)} líneas de SOLPED · ${n0(M.ocs.length)} OC · días calendario`;
    $('#clave').value='';
  }catch(err){ m.className='msg err'; m.textContent='No se pudo publicar. '+err.message; }
  finally{ $('#btnPub').disabled=false; }
};
async function loadData(){
  try{ const r=await fetch('api/datos',{cache:'no-store'}); if(r.headers.get('x-tablero-api')==='1'){ API=true; if(r.ok) return await r.json(); } }catch(_){}
  const r=await fetch('data.json',{cache:'no-cache'}); if(!r.ok) throw new Error('sin datos'); return await r.json();
}

/* carga de reporte nuevo */
function toDay(v){
  if(v==null||v==='') return null;
  if(v instanceof Date){ if(isNaN(v)) return null; return Math.floor(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())/DAY); }
  if(typeof v==='number') return Math.floor(v-25569);
  const t=Date.parse(v); return isNaN(t)?null:Math.floor(t/DAY);
}
function toMin(v){
  if(v==null||v==='') return null;
  if(v instanceof Date){ if(isNaN(v)) return null; return Math.floor(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate(),v.getHours(),v.getMinutes())/6e4); }
  if(typeof v==='number') return Math.floor((v-25569)*1440);
  const t=Date.parse(v); return isNaN(t)?null:Math.floor(t/6e4);
}
$('#btnLoad').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const msg=$('#loadMsg'); msg.hidden=false; msg.className='msg'; msg.textContent=`Leyendo ${f.name}… un archivo de 25 MB puede tardar 20–40 segundos.`;
  $('#loading').hidden=false; $('#loading').textContent='Procesando el reporte…';
  await new Promise(r=>setTimeout(r,50));
  try{
    if(typeof XLSX==='undefined') throw new Error('No se pudo cargar el lector de Excel. Revise la conexión e intente de nuevo.');
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});
    if(!raw.length) throw new Error('La primera hoja está vacía.');
    const norm=r=>{ const o={}; for(const k in r) o[k.trim()]=r[k]; return o; };
    const first=norm(raw[0]); const miss=REQ.filter(c=>!(c in first));
    if(miss.length) throw new Error('Faltan columnas del reporte “Seguimiento de Solpeds”: '+miss.join(', '));
    const num=v=>v==null||v===''?null:(typeof v==='number'?v:parseFloat(String(v).replace(/,/g,'')));
    const L=[];
    for(const r0 of raw){ const r=norm(r0); if(!r['Solped']) continue;
      const oc=r['OC ERP']; L.push({est:String(r['Estado']||''),sp:String(r['Solped']),clu:String(r['Clúster']||''),suc:String(r['Sucursal']||''),tipo:String(r['Tipo Solicitud']||''),cat:String(r['Categoría']||''),comp:String(r['Comprador(a)']||''),prov:String(r['Proveedor']||''),cod:String(r['Código']||''),item:String(r['Nombre de Item']||''),
        tSP:toMin(r['Fecha solped.']),tAp:toMin(r['Fecha Aprob']),fAt:toDay(r['Fecha atención comprador']),tPre:toMin(r['Fecha Preorden']),tPr:toMin(r['Fecha Aprob Precio']),tA1:toMin(r['Fecha Aprob 1 OC']),tA2:toMin(r['Fecha Aprob 2 OC']),tOC:toMin(r['Fecha OC']),oc:(oc==null||oc==='')?null:String(Math.round(num(oc))),fEnt:toDay(r['Fecha de entrega']),tIng:toMin(r['Ult. Fecha Ingr. Bod']),
        qOC:num(r['Cant. Orden Compra'])||0,qIng:num(r['Cant. Ingreso'])||0,qPend:num(r['Cantidad Pendiente'])||0}); derive(L[L.length-1]); }
    const model=buildModel(L);
    setModel(model, `${f.name} (cargado ${new Date().toLocaleDateString('es-EC')})`, model.maxD);
    LAST={L, fuente:f.name, corte:model.maxD}; $('#pubBar').hidden=!API; $('#pubMsg').textContent='';
    msg.textContent=`Reporte cargado: ${n0(L.length)} líneas. Fecha de corte ajustada a ${dstr(model.maxD)}, la fecha más reciente del archivo; puede cambiarla arriba.`;
  }catch(err){ msg.className='msg err'; msg.textContent='No se pudo cargar el archivo. '+err.message; }
  finally{ $('#loading').hidden=true; e.target.value=''; }
};

(async function init(){
  try{
    const D=await loadData();
    const model=buildModel(fromColumnar(D));
    try{ const t=localStorage.getItem('tab'); if(t&&RENDER[t]){ S.tab=t; document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.id==='t-'+t)); document.querySelectorAll('section.panel').forEach(p=>p.hidden=p.id!=='p-'+t);} }catch(_){}
    setModel(model, D.fuente, D.corte);
  }catch(err){
    $('#src').textContent='Sin datos publicados todavía.';
    $('#p-cump').innerHTML='<div class="card"><h2>Aún no hay datos publicados</h2><p class="sub">El administrador debe cargar el Excel “Seguimiento de Solpeds” con “Cargar reporte nuevo” y luego presionar “Publicar para todos”.</p></div>';
  }
  finally{ $('#loading').hidden=true; }
})();
</script>
